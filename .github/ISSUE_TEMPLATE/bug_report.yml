name: Bug report
about: Something did not work as expected
title: "[bug] "
labels: bug
body:
  - type: input
    id: game-build
    attributes:
      label: Game build
      description: The build string of your game (see docs/OFFSETS.md for the supported one).
      placeholder: e.g. 4.18.3-38951
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the game and join a match
        2. Run summercamp-esp.exe
        3. ...
    validations:
      required: true
